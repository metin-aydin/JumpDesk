appId: io.github.metin-aydin.jumpdesk
productName: JumpDesk
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Geliştirme dosyaları, hafıza notları ve yerel eklenti günlükleri pakete girmez.
  - '!{.remember,memory,dev,docs,dist,.github}{,/**/*}'
  - '!{CLAUDE.md,LICENSE,swagger.json,components.json,*.tsbuildinfo}'
asarUnpack:
  - resources/**
afterPack: build/after-pack.cjs
afterSign: build/notarize.cjs
win:
  executableName: jumpdesk
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  artifactName: ${productName}-${version}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# macOS: Apple Silicon ve Intel için dmg (kurulum) ve zip (uygulama içi güncelleme, Squirrel.Mac). Developer ID
# sertifikası CSC_LINK/CSC_KEY_PASSWORD ortam değişkenlerinden gelir. Apple onayını (notarization) ve damgalamayı
# build/notarize.cjs yapar (APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID); electron-builder'ın kendi onayı kapalı.
# Değerler verilmezse imza ve onay atlanır (yalnız derlemeyi denemek için).
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    - NSDocumentsFolderUsageDescription: JumpDesk saves and opens export files in your Documents folder.
    - NSDownloadsFolderUsageDescription: JumpDesk saves downloaded server files to your Downloads folder.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: jumpdesk
  maintainer: metin-aydin
  synopsis: Desktop client for JumpServer
  description: Desktop client for JumpServer with SSH, RDP, a file manager and split view.
  category: Network
  icon: build/icons
  syncDesktopName: true
  desktop:
    entry:
      Name: JumpDesk
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
  appArmorProfile: build/apparmor-profile.tpl
portable:
  artifactName: ${productName}-${version}-Portable.${ext}
npmRebuild: false
# Sürüm dosyaları GitHub Releases'a yüklenir (yalnız --publish verilince): release iş akışı taslak sürümü önceden açar,
# paketler ona eklenir, iş akışının son adımı yayımlar. Uygulama içi güncelleme aynı depoyu okur (src/main/updater.ts).
publish:
  provider: github
  owner: metin-aydin
  repo: JumpDesk
  releaseType: draft
