name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Translations
        run: node dev/i18n-check.mjs
      - name: Unit tests
        run: |
          node dev/alarm-detector.test.mjs
          node dev/ai-safety.test.mjs
          node dev/ai-providers.test.mjs
          node dev/next-version.test.mjs
          node dev/release-notes.test.mjs
      - name: Build
        run: npx electron-vite build

  # PR'larda üç platformun paketi yayımlanmadan üretilir; main'e birleşince yayın akışının paketleme adımı bozulmaz.
  package:
    if: github.event_name == 'pull_request'
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux --x64
          - os: windows-latest
            platform: --win --x64
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        env:
          # PR derlemesi imzalanmaz; yalnız paketlemenin çalıştığı denetlenir.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.platform }} --publish never
