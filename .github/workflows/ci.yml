name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Translations
        run: node dev/i18n-check.mjs
      - name: Unit tests
        run: |
          node dev/alarm-detector.test.mjs
          node dev/ai-safety.test.mjs
          node dev/ai-providers.test.mjs
          node dev/next-version.test.mjs
          node dev/release-notes.test.mjs
      - name: Build
        run: npx electron-vite build
